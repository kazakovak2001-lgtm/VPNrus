# B57-5A - pocvpn-cp-loopback (FRANKFURT variant) - REPO-ONLY TEMPLATE,
# NOT DEPLOYED. Future control-plane edge: Cloudflare -> cloudflared (on
# this host) -> 127.0.0.1:8081 (this file) -> 127.0.0.1:8443 pocvpn-api.
#
# This file is ADDITIVE. It never replaces, includes, or is included by the
# existing public vhost (nginx-pocvpn.conf); that vhost stays unchanged.
# Like every other file in gateway/edge/ it is only valid when included
# from inside an nginx `http {}` block (map/limit_*_zone/log_format are
# http-context directives), and it must pass `nginx -t` on its own - it
# declares only names in the `pocvpn_cp_*` namespace, so it cannot collide
# with the B56-3 zones (`pocvpn_activate_rl`, ...) or any existing map.
#
# Deploy exactly ONE variant per host (this one on Frankfurt,
# nginx-pocvpn-cp-loopback-stockholm.conf on Stockholm) - the two variants
# declare the same pocvpn_cp_* names and must never be loaded together.
#
# Routes (Frankfurt): /v1/manifest (GET), /v1/activate (POST),
# /v1/xray-profile (POST). Everything else -> 404. /v1/field-enroll,
# /v1/peers and /v1/relay-health are deliberately NOT routed here.
#
# Security contract (docs/B57_5A_CONTROL_PLANE_LOOPBACK.md):
#   C1 nginx decides Cache-Control; every upstream caching header is hidden.
#   C2 `public, max-age=300` ONLY for anonymous GET /v1/manifest with a 2xx
#      status; everything else is `private, no-store`.
#   C3 the Cloudflare Cache Rule is a secondary layer only (not configured
#      here; must respect origin Cache-Control, never ignore it).
#   C4 every Cache-Control is emitted with `add_header ... always`.
#
# Written for nginx >= 1.24.0 (the Frankfurt host's version); no directive
# here needs anything newer.

# --- C2: Authorization presence detection (never the value itself) ---
# Any non-empty Authorization header -> 1. Only the presence bit is used;
# the header value never enters a zone key, a log line, or a map result.
map $http_authorization $pocvpn_cp_auth {
    ""      0;
    default 1;
}

# --- C2: /v1/manifest cache decision ---
# Key = "<method>:<auth bit>:<final status>". $status is only read when the
# response header is emitted (add_header), so it is the FINAL status,
# including nginx-generated 403/404/413/429/5xx. Anything that is not
# exactly GET + no Authorization + 2xx falls to the private default
# (HEAD, POST, Authorization present, 3xx/4xx/5xx, empty status).
map "$request_method:$pocvpn_cp_auth:$status" $pocvpn_cp_manifest_cache_control {
    default                   "private, no-store";
    "~^GET:0:2[0-9][0-9]$"    "public, max-age=300";
}

# --- Local edge rate limits (control-plane loopback only; NOT B56-3) ---
# Key is $binary_remote_addr AFTER real_ip (below), i.e. the
# CF-Connecting-IP client address when present. See the doc for the
# fallback when that header is missing (everything keys on 127.0.0.1).
limit_req_zone  $binary_remote_addr zone=pocvpn_cp_manifest_rl:10m rate=120r/m;
limit_req_zone  $binary_remote_addr zone=pocvpn_cp_activate_rl:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=pocvpn_cp_profile_rl:10m  rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pocvpn_cp_conn:10m;

# --- Safe access log: no Authorization, no body, no query string ---
# $uri is the normalised path WITHOUT the query string; $request (which
# carries the query string) and every $http_* header are deliberately
# absent.
log_format pocvpn_cp_log escape=json
    '$time_iso8601 $host "$request_method $uri" $status '
    '$body_bytes_sent $request_time';

server {
    # Loopback ONLY - never 0.0.0.0:8081, never [::]:8081. The only
    # intended client is cloudflared on this same host.
    listen 127.0.0.1:8081 default_server;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/pocvpn-cp-loopback-access.log pocvpn_cp_log;
    error_log  /var/log/nginx/pocvpn-cp-loopback-error.log error;

    client_max_body_size 2k;

    # Real client IP from Cloudflare, trusted ONLY from the local
    # cloudflared connection. Not sufficient on its own for production -
    # B57-5E must verify the real behaviour through cloudflared.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    limit_req_status  429;
    limit_conn_status 429;
    # Rejections are logged at warn, below this server's `error` log level,
    # so a flood never writes request lines into the error log.
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # --- B57-5D PROPOSAL - NOT ACTIVE ---
    # Origin-side HTTPS enforcement (reject requests that reached
    # Cloudflare over plain HTTP). Deliberately commented out; must not be
    # enabled before B57-5D validates the header cloudflared actually
    # forwards (X-Forwarded-Proto vs CF-Visitor).
    #   if ($http_x_forwarded_proto != "https") { return 403; }
    # --- END NOT ACTIVE ---

    # NOTE: `add_header` and `proxy_hide_header` are NOT inherited into a
    # location that declares its own, so every location below carries its
    # full set explicitly instead of relying on server-level inheritance.

    location = /v1/manifest {
        limit_except GET {
            deny all;
        }

        limit_req zone=pocvpn_cp_manifest_rl burst=60 nodelay;
        limit_conn pocvpn_cp_conn 20;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        proxy_hide_header Surrogate-Control;
        add_header Cache-Control $pocvpn_cp_manifest_cache_control always;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location = /v1/activate {
        limit_except POST {
            deny all;
        }

        limit_req zone=pocvpn_cp_activate_rl burst=20 nodelay;
        limit_conn pocvpn_cp_conn 20;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        proxy_hide_header Surrogate-Control;
        add_header Cache-Control "private, no-store" always;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Longer read timeout: a first-time provisioning request synchronously
    # reloads Xray inside the request (same rationale as the public vhost).
    location = /v1/xray-profile {
        limit_except POST {
            deny all;
        }

        limit_req zone=pocvpn_cp_profile_rl burst=20 nodelay;
        limit_conn pocvpn_cp_conn 20;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        proxy_hide_header Surrogate-Control;
        add_header Cache-Control "private, no-store" always;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
    }

    # Fail closed: every other path (including /v1/field-enroll, /v1/peers,
    # /v1/relay-health) is a 404 that can never be cached.
    location / {
        add_header Cache-Control "private, no-store" always;
        return 404;
    }
}
