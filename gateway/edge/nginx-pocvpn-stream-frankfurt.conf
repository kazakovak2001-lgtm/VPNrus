# Frankfurt public TCP/443 SNI split (REALITY on 443, RU field evidence 2026-10-08:
# Frankfurt TCP 2053/2083/28388 intermittently unreachable from a RU network while
# 443 always worked; REALITY to Stockholm on 2053 worked, so the protocol itself
# was not detected).
#
# STREAM context: include from the TOP LEVEL of /etc/nginx/nginx.conf (next to
# `http {}`, never inside it); needs libnginx-mod-stream (ngx_stream_module +
# ngx_stream_ssl_preread_module, nginx 1.24). Nothing is decrypted here: only
# the ClientHello SNI is read.
#
#   public :443 --SNI in REALITY serverNames--> 127.0.0.1:2054 (PROXY header
#                                               stripped) --> Xray 127.0.0.1:2053
#               --anything else / no SNI------> 127.0.0.1:4443 nginx HTTPS vhosts
#                                               (API on the IP cert, edge.*),
#                                               `listen ... proxy_protocol` +
#                                               `real_ip_header proxy_protocol`
#
# Invariants:
# - The map keys MUST equal the live Xray REALITY `serverNames`
#   (/etc/nova-xray/config.json, inbound port 2053) - verify before install.
# - Xray's public 2053 stays as is: the Stockholm REALITY relay
#   (stockholm-ingress-1 -> 152.70.43.1:2053) and older clients use it.
# - Every client reaching the HTTP vhosts keeps its real address via the PROXY
#   protocol (pocvpn-api keys its per-client limits on X-Real-IP = $remote_addr).
# - 2054 and 4443 are loopback-only: no cloud firewall rule for them.

stream {
    map $ssl_preread_server_name $pocvpn_443_backend {
        www.wikipedia.org  127.0.0.1:2054;
        default            127.0.0.1:4443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        preread_timeout 10s;
        proxy_connect_timeout 5s;
        # One VLESS TCP connection per app connection; long idle flows are normal.
        proxy_timeout 1h;
        proxy_protocol on;
        proxy_pass $pocvpn_443_backend;
    }

    # Strips the PROXY header for Xray, which receives plain TCP exactly as on
    # its public 2053 (no Xray change).
    server {
        listen 127.0.0.1:2054 proxy_protocol;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass 127.0.0.1:2053;
    }
}
