#
# Frankfurt Cloudflare origin route (B59). Validate with `nginx -t` before deployment.
#
# Data plane:
#   Android -> Cloudflare edge (public TLS cert) -> HTTPS origin nginx
#           -> 127.0.0.1:2099 -> Xray XHTTP inbound -> authenticated EXIT
#
# The Xray backend is loopback-only. There must be NO cloud
# firewall/security-group rule exposing TCP/2099.
#
# TLS model (B58 owner decision, B59): Cloudflare terminates the public edge
# certificate; Cloudflare -> this origin uses a Cloudflare Origin CA
# certificate (assumed Cloudflare SSL/TLS mode: Full (strict)). This file
# only references the existing Frankfurt Origin CA filesystem paths - it
# does not create, rotate, or otherwise change that certificate/key.
#
# nginx version constraint (B58 audit finding, unchanged by B59): the
# existing Frankfurt control-plane vhost (nginx-pocvpn.conf) documents
# nginx 1.24.0 on this host, which does not support the standalone
# `http2 on;` directive. This file therefore deliberately does not enable
# HTTP/2, matching that existing constraint and the Stockholm B35
# precedent (gateway/edge/nginx-pocvpn-cdn-origin-stockholm.conf), which
# also runs without HTTP/2.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name edge.aknova.pp.ua;

    server_tokens off;

    # Cloudflare Origin CA certificate for this host (B58 owner decision).
    # Pre-existing production paths per prior audit evidence - not created
    # or modified by this file.
    ssl_certificate     /etc/nginx/cloudflare-origin/aknova-origin.pem;
    ssl_certificate_key /etc/nginx/cloudflare-origin/aknova-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/pocvpn-cdn-origin-frankfurt-access.log combined;
    error_log  /var/log/nginx/pocvpn-cdn-origin-frankfurt-error.log warn;

    location / { return 404; }

    # Prefix, not exact match: pinned Xray v26.7.28 defaults session and
    # sequence placement to "path" and appends them below this base path.
    # This literal first-slice path MUST equal the signed provider profile's
    # xhttp.path and NOVA_INGRESS_XHTTP_PATH.
    location ^~ /nova-xhttp/ {
        # SECURITY BOUNDARY:
        # The tunnel origin must not be reachable directly from arbitrary
        # Internet clients. This is the Stockholm B35 Cloudflare CIDR list,
        # carried over as repository precedent - it has NOT been
        # re-verified against Cloudflare's current published ranges in
        # this slice (no network access to Cloudflare from this session).
        # MUST be re-confirmed against https://www.cloudflare.com/ips/
        # before this file is ever deployed.
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;

        # First executable server slice is packet-up + POST. Packet-up uses
        # GET for the downstream request and POST for uplink packets.
        limit_except GET POST {
            deny all;
        }

        # No URI part after the upstream address. nginx therefore preserves
        # /nova-xhttp/<session>/<seq> exactly for Xray. Loopback-only -
        # never the public IP, never a public hostname.
        proxy_pass http://127.0.0.1:2099;
        proxy_http_version 1.1;

        # Fixed operator-controlled Host, never copied from the untrusted
        # incoming Host. MUST equal NOVA_INGRESS_XHTTP_HOST and the signed
        # provider profile's requests.originHostHeader deployment value.
        proxy_set_header Host edge.aknova.pp.ua;
        proxy_set_header Connection "";

        # Do not turn a live XHTTP tunnel into a cacheable web object.
        # These directives govern this origin nginx. The selected CDN's own
        # cache behavior still requires real provider validation.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;

        # Stream both directions rather than accumulating a tunnel request
        # or response in nginx.
        proxy_request_buffering off;
        proxy_buffering off;

        # Edge ceiling only. Xray independently enforces the signed/provider
        # packet ceiling through scMaxEachPostBytes. Keep this >= the
        # deployed NOVA_INGRESS_XHTTP_MAX_EACH_POST_BYTES.
        client_max_body_size 1m;

        # XHTTP is a long-lived transport, not a single short request -
        # proxy_read_timeout below is an INACTIVITY timeout, not a total
        # VPN-session lifetime. Cloudflare enforces its own, separate,
        # shorter edge-side limits; this nginx timeout does not and cannot
        # bypass those - it only bounds this origin's own idle connection
        # handling.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 10m;
    }
}
