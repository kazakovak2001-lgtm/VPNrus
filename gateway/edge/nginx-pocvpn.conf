# B8B2A STAGE 3 - final HTTPS edge vhost, installed ONLY after the real
# Let's Encrypt IP-address certificate for 152.70.43.1 already exists at
# the paths referenced below (see oracle_deploy_b8b2a.sh Stage 2). Replaces
# nginx-pocvpn-bootstrap.conf.
#
# Keeps the SAME port-80 ACME webroot server block as the bootstrap stage -
# short-lived (160h) IP certificates renew every few days for the life of
# this deployment, so the webroot path must keep answering permanently, not
# just for the first issuance.
#
# Architecture: Android -> https://152.70.43.1/v1/{peers,activate,xray-profile}
# -> this vhost (443) -> 127.0.0.1:8443 -> the existing pocvpn-api process
# (gateway/api/handler.py already serves all three; B8K5A added the
# latter two routes here). Exposes exactly these three routes, POST only,
# plus /v1/manifest (B17, GET) and /v1/relay-health (B31, GET - this host's
# real end-to-end relay-proof route once it is pinned as the EXIT for a
# deployed INGRESS, see docs/B31_INGRESS_PRODUCTION_READINESS.md).
# Everything else fails closed. Never proxies to, or otherwise exposes,
# 8443 itself - only this vhost's own 443 listener is reachable from
# outside 127.0.0.1.
#
# B56-3 - Level 1 edge abuse damping for the two UNAUTHENTICATED
# pre-activation routes only (/v1/activate, /v1/manifest). This is
# application-edge abuse containment against accidental retry storms and
# cheap scripted floods, NOT volumetric/network DDoS protection, NOT a
# censorship or hard-whitelist bypass, and independent of B56-2's imported-
# manifest path (see docs/RESILIENT_BOOTSTRAP_ACTIVATION_ARCHITECTURE.md
# section 22 - "four independent layers", this is layer 1 only).
#
# `limit_req_zone`/`limit_conn_zone` MUST live in the nginx `http {}`
# context, never inside `server {}`/`location {}`. This file itself is
# only ever valid nginx input when included from within an `http {}` block
# (see nginx-pocvpn-stockholm.conf's pre-existing top-level `map` directive,
# itself only legal in http context - the same placement precedent this
# file now follows), so these two zone declarations are placed here, at
# file top level, outside any server block - never guessed, following that
# existing precedent.
#
# Key: $binary_remote_addr (compact per-source-IP state, no secret/header/
# credential/body value ever enters a zone key or a log line here).
#
# Values are DELIBERATELY conservative initial bootstrap-safe defaults,
# NOT empirically tuned - this repository has no production telemetry on
# real per-IP activation/manifest request rates (client-side,
# refreshManifest() is opportunistic/mutex-guarded with no fixed polling
# interval - see MainViewModel.kt - and activation has no fixed client
# retry cadence either). They are an explicit abuse-damping TRADE-OFF, not
# a guarantee: a legitimate client CAN still receive 429 if it exceeds
# these bounds (e.g. an unusually large or bursty CGNAT population sharing
# one public IP), and this is Level 1 application-edge abuse damping only
# - it is NOT volumetric/network DDoS protection and NOT a censorship or
# hard-whitelist bypass mechanism.
#
# `burst`/`rate` below govern REQUEST-RATE tolerance only - they do NOT
# mean that many requests may run CONCURRENTLY. The separate
# `limit_conn pocvpn_bootstrap_conn 20` applied per location below is the
# actual concurrent-connection/in-flight-request ceiling per source IP for
# BOTH routes - a `burst=60` manifest allowance never means 60 simultaneous
# manifest requests can all be in flight at once from one IP; at most 20
# of any combination of /v1/activate + /v1/manifest requests from that IP
# are ever processed concurrently, request-rate bursts are absorbed (or
# rejected with 429) independently of that ceiling:
#   - /v1/activate: rare per device, POST, more expensive (see below) ->
#     30r/m sustained (1 every 2s), burst=20 nodelay - absorbs a short
#     burst of activation requests arriving close together from a shared
#     CGNAT IP (e.g. after a shared network's connectivity is restored)
#     without necessarily rejecting the first few, while still bounding
#     sustained request-rate abuse.
#   - /v1/manifest: GET, safe/idempotent, legitimately requested more often
#     and may see bursty fleet-wide refresh/recovery traffic -> 120r/m
#     sustained (2/s), burst=60 nodelay - a larger REQUEST-RATE burst
#     allowance than /v1/activate, matching its lighter, more frequent
#     traffic shape; still bounded by the SAME shared 20-connection
#     concurrency ceiling above, not a separate, larger one.
#   - `nodelay` on both: excess requests within the burst allowance are
#     served immediately rather than artificially queued/delayed (which
#     would risk nginx-side queuing racing the client's own connect/read
#     timeouts and producing a confusing hang instead of a clean, explicit
#     rejection) - anything beyond the burst is rejected outright with the
#     explicit status below, never silently delayed.
#   - Rejection status: 429 (Too Many Requests, supported by nginx 1.24.0,
#     the deployed version per this file's own HTTP/2 comment below) for
#     BOTH `limit_req` and `limit_conn` here - never nginx's ambiguous
#     default (503), and never custom HTML that could leak server details.
# See gateway/api/tests/test_control_plane_nginx_rate_limits.py for the
# static proof these values/keys/status/parity actually hold.
limit_req_zone $binary_remote_addr zone=pocvpn_activate_rl:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pocvpn_manifest_rl:10m rate=120r/m;

# Concurrency ceiling: ONE shared zone for both bootstrap routes - both are
# pre-activation/unauthenticated routes with the same abuse-containment
# need, and a per-route split here would only add a second number to keep
# in parity for no behavioral benefit (unlike the request-rate zones
# above, which differ because the routes' real traffic *shapes* differ).
# This is the ACTUAL concurrent-request ceiling per source IP for both
# routes combined - the request-rate `burst` values above are a separate
# axis (how many requests over time are tolerated before 429) and do not
# raise this number. 20 concurrent connections per source IP is a
# deliberately conservative-but-not-tiny ceiling whose purpose is obvious
# abuse containment (e.g. a runaway script opening connections in a loop),
# not everyday traffic shaping - but it is a real, enforced bound, not a
# guarantee that every legitimate concurrent burst passes through
# unaffected.
limit_conn_zone $binary_remote_addr zone=pocvpn_bootstrap_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/pocvpn-acme;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}

server {
    # Plain HTTPS over HTTP/1.1 - deliberately no HTTP/2 in this slice.
    # nginx 1.24.0 (the Oracle host's version) does not support the
    # standalone `http2 on;` directive (that needs 1.25.1+; the older
    # `listen ... http2;` form is deprecated and not worth reintroducing
    # for a single machine-to-machine POST endpoint). HTTP/2 is not
    # required for this provisioning endpoint - not adding it back here
    # avoids upgrading nginx merely to support it.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/152.70.43.1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.70.43.1/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # No static/directory serving anywhere in this vhost - every response
    # is either the one proxied route below or an explicit 404. No `root`,
    # no `alias`, no `autoindex` directive exists in this file.

    # `log_format` is only valid in the http {} context, not inside a
    # server {} block - use nginx's built-in `combined` format instead of
    # a custom one. `combined` logs $remote_addr, the request line,
    # status, bytes, $http_referer and $http_user_agent - it does NOT log
    # the Authorization header (the Bearer enrollment token) or the
    # request body, so it already satisfies the "never log Authorization"
    # requirement without a custom format.
    access_log /var/log/nginx/pocvpn_access.log combined;
    error_log  /var/log/nginx/pocvpn-edge-error.log warn;

    client_max_body_size 2k;  # API's own cap is 1024 bytes (_MAX_BODY_BYTES in gateway/api/handler.py) - a little headroom, not "unlimited"

    # B56-3 - explicit, non-default rejection status for BOTH `limit_req`
    # and `limit_conn` in this vhost. Server-level (not per-location) so it
    # applies uniformly wherever either limiting mechanism actually fires
    # below - there is no server-wide default limiter active without a
    # matching `limit_req`/`limit_conn` directive in a location, so this
    # alone changes nothing for the unprotected routes.
    limit_req_status 429;
    limit_conn_status 429;

    location = /v1/peers {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # Forward the client's Authorization header to pocvpn-api verbatim -
        # this is how the existing B8B1 bearer-token auth keeps working
        # unchanged. proxy_pass_request_headers is nginx's default (on) and
        # is not overridden here, so this header (and Content-Type, etc.)
        # passes through without any extra directive.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Short, sane timeouts - matched to the API's own 5s per-connection
        # socket timeout (_SOCKET_TIMEOUT_SECONDS in gateway/api/handler.py)
        # plus a small margin for proxy overhead, not an open-ended wait.
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B8K5A - /v1/activate (B8C1) was already served by pocvpn-api but had
    # no edge route of its own; added here, byte-for-byte the same
    # hardened shape as /v1/peers above (same upstream, same header
    # forwarding, same timeouts) - this is machine-to-machine activation
    # traffic, not a different trust boundary.
    location = /v1/activate {
        limit_except POST {
            deny all;
        }

        # B56-3 - see this file's own top-level zone-declaration comment
        # for the exact values and rationale (30r/m, burst=20, nodelay,
        # shared 20-connection concurrency ceiling).
        limit_req zone=pocvpn_activate_rl burst=20 nodelay;
        limit_conn pocvpn_bootstrap_conn 20;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B8K5A - /v1/xray-profile (B8K2/B8K2A): same edge shape again, with a
    # longer proxy_read_timeout than /v1/peers and /v1/activate - a
    # provisioning request that actually mints a NEW identity synchronously
    # renders/stages/validates/publishes/reloads the live Xray server
    # (gateway/api/xray_reload.py's own subprocess, bounded by
    # POCVPN_API_XRAY_ACTIVATION_TIMEOUT_SECONDS, default 15s - see
    # gateway/api/config.py) inside the SAME request/response, which
    # /v1/peers and /v1/activate never do. 10s here would risk nginx
    # closing the upstream connection before pocvpn-api's own longer
    # subprocess timeout has even had a chance to fail cleanly on its own.
    location = /v1/xray-profile {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
    }

    # B17 - /v1/manifest (B12): GET-only, serves the operator-deployed
    # already-signed manifest artifact verbatim - same edge shape as
    # /v1/activate and /v1/xray-profile, but limited to GET.
    location = /v1/manifest {
        limit_except GET {
            deny all;
        }

        # B56-3 - see this file's own top-level zone-declaration comment
        # for the exact values and rationale (120r/m, burst=60, nodelay,
        # shared 20-connection concurrency ceiling).
        limit_req zone=pocvpn_manifest_rl burst=60 nodelay;
        limit_conn pocvpn_bootstrap_conn 20;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B31 - GET /v1/relay-health (B26 task B): this host acting as the pinned
    # EXIT for the Stockholm INGRESS relay - answers the real end-to-end
    # proof [HttpRelayEndToEndProbe] issues over the just-established tunnel.
    # Same edge shape as /v1/manifest (GET-only, same upstream/timeouts) -
    # the request's own Authorization header (the relay probe token, never
    # logged by this vhost's own `combined` access_log format above) passes
    # through unchanged via nginx's default proxy_pass_request_headers.
    # Fails closed with 503 at the SAME upstream (gateway/api/handler.py)
    # until POCVPN_API_RELAY_PROBE_HMAC_SECRET_FILE is actually configured -
    # this location block alone does not turn relay-health "on".
    location = /v1/relay-health {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
