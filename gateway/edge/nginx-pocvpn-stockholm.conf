# B15 - Stockholm (AWS eu-north-1) gateway edge vhost, mirrors
# gateway/edge/nginx-pocvpn.conf (Germany/Oracle)'s own shape. Installed
# after the real Let's Encrypt IP-address certificate for 16.170.208.231
# already exists at the paths referenced below (see gateway/edge/
# certbot-deploy-hook.sh and the B13 renewal hook that keeps it current).
#
# Keeps the SAME port-80 ACME webroot server block as the bootstrap stage -
# short-lived (160h) IP certificates renew every few days for the life of
# this deployment, so the webroot path must keep answering permanently, not
# just for the first issuance.
#
# Architecture: Android -> https://16.170.208.231/v1/{peers,activate,xray-profile}
# -> this vhost (443) -> 127.0.0.1:8443 -> the existing pocvpn-api process
# (gateway/api/handler.py already serves all three; B8K5A added the
# latter two routes here). Exposes exactly these three routes, POST only,
# plus /v1/manifest (B17, GET) and, once this host also runs the INGRESS
# role (B31), /v1/ingress-profile (POST) - the ONLY route proxied to the
# ingress role's own SEPARATE loopback port 127.0.0.1:8444, never 8443 -
# see that location block's own docs and
# docs/B31_INGRESS_PRODUCTION_READINESS.md. Everything else fails closed.
# Never proxies to, or otherwise exposes, 8443 or 8444 themselves - only
# this vhost's own 443 listener is reachable from outside 127.0.0.1. The
# ingress role's separate client-facing Xray REALITY listener (TCP 2093)
# is NOT proxied here at all - nginx never touches that raw transport, see
# gateway/config/ingress.env.example's own NOVA_INGRESS_SERVER_PORT.

map $http_x_ingress_transport $pocvpn_ingress_profile_backend {
    default 127.0.0.1:8444;
    xhttp 127.0.0.1:8445;
}

# B56-3 - Level 1 edge abuse damping for the two UNAUTHENTICATED
# pre-activation routes only (/v1/activate, /v1/manifest). This is
# application-edge abuse containment against accidental retry storms and
# cheap scripted floods, NOT volumetric/network DDoS protection, NOT a
# censorship or hard-whitelist bypass, and independent of B56-2's imported-
# manifest path (see docs/RESILIENT_BOOTSTRAP_ACTIVATION_ARCHITECTURE.md
# section 22 - "four independent layers", this is layer 1 only). MUST be
# in parity with nginx-pocvpn.conf (Germany) - see that file's own comment
# here for the full values/rationale (key, sustained rate, burst, nodelay,
# concurrency ceiling, rejection status); duplicated verbatim below rather
# than referenced, since each vhost is deployed to a separate host and each
# file must independently pass `nginx -t` on its own.
#
# `limit_req_zone`/`limit_conn_zone` MUST live in the nginx `http {}`
# context, never inside `server {}`/`location {}` - this file is only ever
# valid nginx input when included from within an `http {}` block (the
# `map` directive immediately above is itself only legal in http context,
# the same placement precedent this follows), so these zone declarations
# sit here, at file top level, outside any server block.
#
# Key: $binary_remote_addr - no secret/header/credential/body value ever
# enters a zone key or a log line here.
limit_req_zone $binary_remote_addr zone=pocvpn_activate_rl:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pocvpn_manifest_rl:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=pocvpn_bootstrap_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/pocvpn-acme;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}

server {
    # Plain HTTPS over HTTP/1.1 - deliberately no HTTP/2 in this slice.
    # nginx 1.24.0 (the Oracle host's version) does not support the
    # standalone `http2 on;` directive (that needs 1.25.1+; the older
    # `listen ... http2;` form is deprecated and not worth reintroducing
    # for a single machine-to-machine POST endpoint). HTTP/2 is not
    # required for this provisioning endpoint - not adding it back here
    # avoids upgrading nginx merely to support it.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/16.170.208.231/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16.170.208.231/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # No static/directory serving anywhere in this vhost - every response
    # is either the one proxied route below or an explicit 404. No `root`,
    # no `alias`, no `autoindex` directive exists in this file.

    # `log_format` is only valid in the http {} context, not inside a
    # server {} block - use nginx's built-in `combined` format instead of
    # a custom one. `combined` logs $remote_addr, the request line,
    # status, bytes, $http_referer and $http_user_agent - it does NOT log
    # the Authorization header (the Bearer enrollment token) or the
    # request body, so it already satisfies the "never log Authorization"
    # requirement without a custom format.
    access_log /var/log/nginx/pocvpn_access.log combined;
    error_log  /var/log/nginx/pocvpn-edge-error.log warn;

    client_max_body_size 2k;  # API's own cap is 1024 bytes (_MAX_BODY_BYTES in gateway/api/handler.py) - a little headroom, not "unlimited"

    # B56-3 - explicit, non-default rejection status for BOTH `limit_req`
    # and `limit_conn` in this vhost - see nginx-pocvpn.conf's identical
    # comment. Server-level so it applies uniformly wherever either
    # limiter actually fires below; unprotected routes are unaffected.
    limit_req_status 429;
    limit_conn_status 429;

    location = /v1/peers {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # Forward the client's Authorization header to pocvpn-api verbatim -
        # this is how the existing B8B1 bearer-token auth keeps working
        # unchanged. proxy_pass_request_headers is nginx's default (on) and
        # is not overridden here, so this header (and Content-Type, etc.)
        # passes through without any extra directive.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Short, sane timeouts - matched to the API's own 5s per-connection
        # socket timeout (_SOCKET_TIMEOUT_SECONDS in gateway/api/handler.py)
        # plus a small margin for proxy overhead, not an open-ended wait.
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B8K5A - /v1/activate (B8C1) was already served by pocvpn-api but had
    # no edge route of its own; added here, byte-for-byte the same
    # hardened shape as /v1/peers above (same upstream, same header
    # forwarding, same timeouts) - this is machine-to-machine activation
    # traffic, not a different trust boundary.
    location = /v1/activate {
        limit_except POST {
            deny all;
        }

        # B56-3 - see nginx-pocvpn.conf's identical comment for exact
        # values/rationale (30r/m, burst=20, nodelay, shared 20-connection
        # concurrency ceiling) - kept in parity with Germany.
        limit_req zone=pocvpn_activate_rl burst=20 nodelay;
        limit_conn pocvpn_bootstrap_conn 20;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B8K5A - /v1/xray-profile (B8K2/B8K2A): same edge shape again, with a
    # longer proxy_read_timeout than /v1/peers and /v1/activate - a
    # provisioning request that actually mints a NEW identity synchronously
    # renders/stages/validates/publishes/reloads the live Xray server
    # (gateway/api/xray_reload.py's own subprocess, bounded by
    # POCVPN_API_XRAY_ACTIVATION_TIMEOUT_SECONDS, default 15s - see
    # gateway/api/config.py) inside the SAME request/response, which
    # /v1/peers and /v1/activate never do. 10s here would risk nginx
    # closing the upstream connection before pocvpn-api's own longer
    # subprocess timeout has even had a chance to fail cleanly on its own.
    location = /v1/xray-profile {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
    }

    # B46-4P - /v1/hysteria-profile: POST-only, same edge shape as
    # /v1/xray-profile, proxied to this host's EXIT-role pocvpn-api (8443).
    # Stockholm only: Android calls this route ONLY on the host a signed
    # HYSTERIA2 EndpointTransportBinding pins (Hysteria2ProfileProvisioner),
    # and no other gateway carries one. pocvpn-api answers 503
    # hysteria_not_configured until POCVPN_API_HYSTERIA2_* is set, so
    # shipping this block before the Hysteria2 server exists is inert. The
    # loopback auth backend (hysteria_auth_server.py) is NEVER routed here.
    location = /v1/hysteria-profile {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B17 - /v1/manifest (B12): GET-only, serves the operator-deployed
    # already-signed manifest artifact verbatim - same edge shape as
    # /v1/activate and /v1/xray-profile, but limited to GET.
    location = /v1/manifest {
        limit_except GET {
            deny all;
        }

        # B56-3 - see nginx-pocvpn.conf's identical comment for exact
        # values/rationale (120r/m, burst=60, nodelay, shared 20-connection
        # concurrency ceiling) - kept in parity with Germany.
        limit_req zone=pocvpn_manifest_rl burst=60 nodelay;
        limit_conn pocvpn_bootstrap_conn 20;

        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # B31 - POST /v1/ingress-profile (B25 task G): this host ALSO runs the
    # INGRESS role's own, SEPARATE pocvpn-api-ingress.service process
    # (gateway/systemd/pocvpn-api-ingress.service), bound to its own
    # loopback port 127.0.0.1:8444 - deliberately NOT 8443, which stays
    # exclusively this host's EXISTING EXIT-role pocvpn-api.service (the
    # /v1/peers /v1/activate /v1/xray-profile /v1/manifest routes above).
    # The two processes/env files/systemd units/state directories never
    # share a port or a store - see docs/B31_INGRESS_PRODUCTION_READINESS.md
    # and gateway/config/ingress.env.example's own POCVPN_API_API_PORT
    # comment. Same edge shape as /v1/xray-profile (POST-only, longer read
    # timeout - this request synchronously provisions a device identity AND
    # mints a relay probe token in one round trip).
    location = /v1/ingress-profile {
        limit_except POST {
            deny all;
        }

        proxy_pass http://$pocvpn_ingress_profile_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
