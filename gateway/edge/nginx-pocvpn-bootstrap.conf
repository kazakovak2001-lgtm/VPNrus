# B8B2A STAGE 1 - ACME bootstrap vhost, installed BEFORE any certificate
# exists. Serves only the HTTP-01 webroot challenge path so Certbot can
# issue the first IP-address certificate for 152.70.43.1. Replaced by
# nginx-pocvpn.conf once that certificate exists (see gateway/edge/README
# notes in oracle_deploy_b8b2a.sh's own comments - this file's server block
# for port 80 is reused verbatim there, since renewal needs the same
# webroot path to keep working for the life of the deployment).
#
# Deliberately does NOT redirect to HTTPS and does NOT serve anything else -
# there is no HTTPS vhost to redirect to yet at this stage.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/pocvpn-acme;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
