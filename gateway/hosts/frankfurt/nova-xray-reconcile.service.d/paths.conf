# B47 Frankfurt - host-specific write paths for nova-xray-reconcile.service.
# Install as /etc/systemd/system/nova-xray-reconcile.service.d/paths.conf
# (owner-approved rollout only, see gateway/DEPLOYMENT.md).
#
# Frankfurt's /etc/pocvpn/api.env (read-only precheck 2026-10-04) keeps the
# Xray activation lock, last-activated hash and staging config under
# /var/lib/pocvpn-xray, not under the base unit's /var/lib/pocvpn-provision:
#   XRAY_ACTIVATION_LOCK_PATH      /var/lib/pocvpn-xray/xray-activation.lock (opened O_RDWR every run)
#   XRAY_ACTIVATION_LAST_HASH_PATH /var/lib/pocvpn-xray/xray-activation.last-sha256 (mkstemp + replace)
#   XRAY_STAGING_CONFIG_PATH       /var/lib/pocvpn-xray/staging/candidate-config.json
# /etc/nova-xray: the sudo nova-xray-reload root child publishes the live
# config there and inherits this unit's mount namespace (DAC still keeps
# pocvpn-api itself out).
#
# Deliberately NOT writable: /var/lib/pocvpn-activation (activation store
# and its lock are only opened O_RDONLY for a shared lock) and
# /var/lib/pocvpn-provision (token store, not used by this unit). The empty
# assignment resets the base unit's list instead of widening it.
# Pinned by gateway/tools/tests/test_reconcile_unit_paths.py.
[Service]
ReadWritePaths=
ReadWritePaths=/var/lib/pocvpn-xray /etc/nova-xray
